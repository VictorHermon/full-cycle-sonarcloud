name: ci-sonarcloud
on:
  pull_request:
    branches:
      - develop
jobs:
  check-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Set up Go version
        uses: actions/setup-go@v6
        with:
          go-version: 1.26
      - name: Test with coverprofile
        run: go test -coverprofile=coverage.out
